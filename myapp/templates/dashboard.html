{% extends 'main.html' %}
{% load static %}
{% block contentarea %}
<html lang="en">
<head>
    <style>
        body {

        }
        table {
        border-collapse: collapse;
        width: 90%;
        }
        table, th, td {
        text-align:center;
        border: 1px solid black;
        }

    </style>
</head>
<body>
<center>
    <h2>Appointments</h2>
<table border="1">
    <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Doctor Name</th>
        <th>Date</th>
        <th>Time</th>
        <th>Problem</th>
    </tr>
    {% for a in appointments %}
    <tr>
        <td>{{ a.name }}</td>
        <td>xxxxxxxxxx</td>
        <td>{{ a.doctor }}</td>
        <td>{{ a.date }}</td>
        <td>{{ a.time }}</td>
        <td>{{ a.problem }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="4">No appointments found.</td>
    </tr>
    {% endfor %}
</table>
</center>
</body>
</html>
{% endblock %}
