{% load static %}
<html lang="en">
<head>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/font-awesome.min.css' %}" rel="stylesheet">
    <script src="{% static 'js/jquery.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <title>Appointment Booking System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f9fbff;
        }
        .my-navbar {
            background-color: rgb(10, 10, 75);
            padding: 14px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .nav-links {
            list-style: none;
            display: flex;
            gap: 8px;
            margin: 0;
        }
        .nav-links a {
            text-decoration: none;
            color: rgba(255,255,255,0.85);
            font-size: 15px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            transition: all 0.25s;
        }
        .nav-links a:hover {
            background-color: rgb(65, 209, 173);
            color: rgb(10, 10, 75);
            font-weight: 700;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .logo img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid rgb(65, 209, 173);
        }
        .logo-text {
            color: white;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .logo-text span {
            color: rgb(65, 209, 173);
        }
        .page-content {
            width: 100%;
        }
    </style>
</head>
<body>
<nav class="my-navbar">
    <a href="{% url 'index' %}" class="logo">
        <img src="{% static 'image/logo.jpeg' %}" alt="logo">
        <span class="logo-text">Health<span>Care</span></span>
    </a>
    <ul class="nav-links">
        <li><a href="{% url 'index' %}">Home</a></li>
        <li><a href="{% url 'doctor' %}">Doctors</a></li>
        <li><a href="{% url 'book' %}">Book Appointment</a></li>
        <li><a href="{% url 'dashboard' %}">My Appointments</a></li>
        <li><a href="{% url 'contact' %}">Contact</a></li>
    </ul>
</nav>

<div class="page-content">
    {% block contentarea %}
    {% endblock %}
</div>

</body>
</html>
